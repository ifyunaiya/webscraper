{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Preview | Price Tracker</title>
    <link rel="stylesheet" href="{% static 'home.css' %}">

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen ">

    <main class="container mx-auto max-w-4xl px-4 py-12">

        <!-- Page heading -->
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-neutral-900">
                Product Page
            </h1>

            <p class="mt-3 text-neutral-500">
                Review your product before tracking its price.
            </p>
        </div>

        <!-- Product preview card -->
        <div class="mx-auto max-w-xl rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm">

            <!-- Product image placeholder -->
            <div class="flex h-64 items-center justify-center rounded-xl bg-neutral-100">
                <p class="text-neutral-400">
                    Product image will appear here
                </p>
            </div>

            <!-- Product information -->
            <div class="mt-6">

                <h2 class="text-xl font-bold text-neutral-900">
                    Zara Product
                </h2>

                <p class="mt-4 text-sm font-medium text-neutral-500">
                    Product URL
                </p>

                <p class="mt-2 break-all text-sm text-pink-600">
                    {{ product_url }}
                </p>

                <div class="my-6 border-t border-neutral-200"></div>

                <div class="flex justify-between">
                    <span class="text-neutral-500">
                        Current price
                    </span>

                    <span class="font-semibold text-neutral-900">
                        Not retrieved yet
                    </span>
                </div>

                <!-- Track button -->
                <button
                    type="button"
                    class="mt-8 w-full rounded-xl bg-neutral-900 px-6 py-4 font-semibold text-white transition hover:bg-pink-600">
                    Add to Tracking Cart
                </button>

            </div>
        </div>

        <!-- Back button -->
        <div class="mt-8 text-center">
            <a href="/"
               class="text-sm text-neutral-500 hover:text-pink-600">
                ← Back to homepage
            </a>
        </div>

    </main>

</body>
</html>
